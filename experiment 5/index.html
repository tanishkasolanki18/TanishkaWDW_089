<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

      <h2 align="center">Student Registration Form</h2>
      <hr>

      <form action="#" method="post">

        <!--Full Name-->
        <p>
            <label>Full Name</label>
            <input type="text" name="fullname" placeholder="Enter your full name" required>
         </p>

        <!--Email-->
        <p>
            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email address" required>
        </p>

        <!--Password-->
        <p>
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required> 
        </p>

        <!--Gender-->
        <p>
            <label>Gender</label>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female
            <input type="radio" name="gender" value="Other">Other
        </p>

        <!--Course-->
        <p>
        <label>Course</label>
        <select name="course">
            <option>B.Tech CSE</option>
            <option>B.Tech ECE</option>
            <option>B.Tech ME</option>
            <option>B.Tech Civil</option>
        </select>
        </p>

        <!--Contact Number-->
        <p>
            <label>Contact No.</label>
            <input type="tel" name="contact" placeholder="Enter phone number" required>
        </p>

        <!--Address-->
        <p>
            <label>Address</label>
            <br>
            <textarea name="address" rows="4" cols="40" placeholder="Enter your address " required></textarea>
        </p>

        <!--Submit and Reset-->
        <p>
            <input type="submit" value="Register">
            <input type="rest" value="clear">
        </p>

        </form>
        <hr>
        <p align="center">&copy; 2026 Student Registration Portal</p>

        </body>
        </html>
